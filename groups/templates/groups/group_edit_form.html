{% extends "base.html" %}
{% block title %}Sửa thông tin nhóm — {{ group.name }}{% endblock %}

{% block breadcrumb %}
<nav class="group-breadcrumb" aria-label="Đường dẫn trang">
    <a href="{% url 'home' %}">Trang chủ</a>
    <span class="separator" aria-hidden="true">›</span>

    <a href="{% url 'groups:list' %}">Nhóm</a>
    <span class="separator" aria-hidden="true">›</span>

    <a href="{{ group.get_absolute_url }}">{{ group.name }}</a>
    <span class="separator" aria-hidden="true">›</span>

    <span aria-current="page">Sửa thông tin</span>
</nav>
{% endblock %}

{% block content %}
<div class="card">
    <h1>Sửa thông tin nhóm "{{ group.name }}"</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Lưu</button>
        <a class="btn btn-secondary" href="{{ group.get_absolute_url }}">Hủy</a>
    </form>
</div>
{% endblock %}
